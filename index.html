<!-- App Container -->
<div id="app" class="flex-1 flex flex-col h-full min-h-screen overflow-hidden">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="app.goLobby()">
            <div class="bg-gradient-to-tr from-rose-500 to-pink-500 p-2.5 rounded-xl shadow-lg shadow-rose-500/20">
                <i data-lucide="book-open" class="w-6 h-6 text-white"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Boxcument</h1>
                <p class="text-xs text-slate-400">Nền tảng học Tiếng Trung thông minh</p>
            </div>
        </div>
        <div id="header-actions" class="flex items-center space-x-3">
            <!-- Dynamic Header Actions -->
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content" class="flex-1 overflow-y-auto p-6 bg-slate-950">
        <!-- Dynamic Views Render Here -->
    </main>
</div>

<!-- Application Script -->
<script>
    // Dữ liệu bài học được nhúng trực tiếp vào file
    const appData = {
        title: "Tiếng Trung Tổng Hợp",
        description: "Hệ thống bài học từ vựng, ngữ pháp và luyện tập giao tiếp từ cơ bản đến nâng cao.",
        lessons: [
            {
                id: 1,
                title: "Bài 1: Xin chào & Chào hỏi cơ bản",
                description: "Làm quen với các câu chào hỏi thông dụng hàng ngày trong tiếng Trung.",
                vocabulary: [
                    { hanzi: "你好", pinyin: "nǐ hǎo", meaning: "Xin chào" },
                    { hanzi: "谢谢", pinyin: "xièxie", meaning: "Cảm ơn" },
                    { hanzi: "再见", pinyin: "zàijiàn", meaning: "Tạm biệt" },
                    { hanzi: "不客气", pinyin: "bú kèqi", meaning: "Không có gì" }
                ],
                grammar: "Cấu trúc chào hỏi cơ bản: Chủ ngữ + 好 (hǎo). Ví dụ: 你好 (Bạn tốt -> Xin chào)."
            },
            {
                id: 2,
                title: "Bài 2: Giới thiệu bản thân",
                description: "Cách hỏi và trả lời tên, quốc tịch và nghề nghiệp.",
                vocabulary: [
                    { hanzi: "我", pinyin: "wǒ", meaning: "Tôi, tớ" },
                    { hanzi: "叫", pinyin: "jiào", meaning: "Gọi là, tên là" },
                    { hanzi: "名字", pinyin: "míngzi", meaning: "Tên" },
                    { hanzi: "中国", pinyin: "zhōngguó", meaning: "Trung Quốc" }
                ],
                grammar: "Cấu trúc giới thiệu tên: 我叫 + [Tên của bạn]. Ví dụ: 我叫张华 (Tôi tên là Trương Hoa)."
            },
            {
                id: 3,
                title: "Bài 3: Mua sắm & Giá cả",
                description: "Hỏi giá tiền, số đếm và thương lượng khi mua sắm.",
                vocabulary: [
                    { hanzi: "多少", pinyin: "duōshao", meaning: "Mấy, bao nhiêu" },
                    { hanzi: "钱", pinyin: "qián", meaning: "Tiền" },
                    { hanzi: "块", pinyin: "kuài", meaning: "Đồng (tệ)" },
                    { hanzi: "太贵了", pinyin: "tài guì le", meaning: "Đắt quá rồi" }
                ],
                grammar: "Hỏi giá tiền: [Sản phẩm] 多少钱？ Ví dụ: 这个多少钱？ (Cái này bao nhiêu tiền?)."
            }
        ]
    };

    class ChineseApp {
        constructor() {
            this.currentLesson = null;
            // Khởi chạy hiển thị danh mục bài học
            this.goLobby();
        }

        goLobby() {
            const main = document.getElementById('main-content');
            const headerActions = document.getElementById('header-actions');
            
            headerActions.innerHTML = `
                <span class="text-xs px-3 py-1.5 bg-slate-800 text-slate-300 rounded-full border border-slate-700/60 font-medium">
                    ${appData.lessons.length} Bài học
                </span>
            `;

            let html = `
                <div class="max-w-5xl mx-auto space-y-8 pb-12">
                    <!-- Hero Banner -->
                    <div class="bg-gradient-to-r from-rose-950/40 via-slate-900 to-slate-900 border border-slate-800/80 rounded-2xl p-8 shadow-xl">
                        <h2 class="text-3xl font-extrabold text-white mb-2">${appData.title}</h2>
                        <p class="text-slate-400 max-w-2xl text-sm leading-relaxed">${appData.description}</p>
                    </div>

                    <!-- Lesson Grid -->
                    <div>
                        <h3 class="text-lg font-bold text-slate-200 mb-4 flex items-center space-x-2">
                            <i data-lucide="layers" class="w-5 h-5 text-rose-500"></i>
                            <span>Danh mục bài học</span>
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            `;

            appData.lessons.forEach(lesson => {
                html += `
                    <div onclick="app.loadLesson(${lesson.id})" class="group bg-slate-900/60 hover:bg-slate-900 border border-slate-800 hover:border-rose-500/50 rounded-xl p-6 transition-all duration-300 cursor-pointer shadow-md hover:shadow-rose-500/10 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-xs font-semibold px-2.5 py-1 bg-rose-500/10 text-rose-400 rounded-md border border-rose-500/20">Bài ${lesson.id}</span>
                                <i data-lucide="arrow-right" class="w-4 h-4 text-slate-500 group-hover:text-rose-400 group-hover:translate-x-1 transition-all"></i>
                            </div>
                            <h4 class="font-bold text-slate-100 text-base mb-2 group-hover:text-rose-300 transition-colors">${lesson.title}</h4>
                            <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed">${lesson.description}</p>
                        </div>
                        <div class="mt-6 pt-4 border-t border-slate-800/60 flex items-center justify-between text-xs text-slate-500">
                            <span>${lesson.vocabulary.length} từ vựng</span>
                            <span class="text-rose-400 font-medium group-hover:underline">Bắt đầu học →</span>
                        </div>
                    </div>
                `;
            });

            html += `
                        </div>
                    </div>
                </div>
            `;

            main.innerHTML = html;
            lucide.createIcons();
        }

        // Đồng bộ tên phương thức để tránh lỗi Uncaught TypeError
        renderLobby() {
            this.goLobby();
        }

        loadLesson(id) {
            this.currentLesson = appData.lessons.find(l => l.id === id);
            if (!this.currentLesson) return;

            const main = document.getElementById('main-content');
            const headerActions = document.getElementById('header-actions');

            headerActions.innerHTML = `
                <button onclick="app.goLobby()" class="flex items-center space-x-1.5 text-xs font-medium px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg transition-colors border border-slate-700">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>Quay lại danh mục</span>
                </button>
            `;

            let vocabHtml = '';
            this.currentLesson.vocabulary.forEach((item, idx) => {
                vocabHtml += `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 flex items-center justify-between hover:border-slate-700 transition-colors">
                        <div class="flex items-center space-x-4">
                            <span class="w-7 h-7 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center text-xs font-bold">${idx + 1}</span>
                            <div>
                                <div class="text-2xl font-bold text-white mb-0.5">${item.hanzi}</div>
                                <div class="text-xs text-rose-400 font-medium">${item.pinyin}</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="-sm font-medium text-slate-300 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700/50">${item.meaning}</span>
                        </div>
                    </div>
                `;
            });

            main.innerHTML = `
                <div class="max-w-4xl mx-auto space-y-8 pb-12">
                    <!-- Lesson Header -->
                    <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6">
                        <span class="text-xs font-semibold px-2.5 py-1 bg-rose-500/10 text-rose-400 rounded-md border border-rose-500/20 mb-3 inline-block">Bài học #${this.currentLesson.id}</span>
                        <h2 class="text-2xl font-bold text-white mb-2">${this.currentLesson.title}</h2>
                        <p class="text-slate-400 text-sm">${this.currentLesson.description}</p>
                    </div>

                    <!-- Grammar Section -->
                    <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-6">
                        <h3 class="text-base font-bold text-slate-200 mb-3 flex items-center space-x-2">
                            <i data-lucide="book" class="w-5 h-5 text-rose-500"></i>
                            <span>Ngữ pháp trọng tâm</span>
                        </h3>
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl text-slate-300 text-sm leading-relaxed">
                            ${this.currentLesson.grammar}
                        </div>
                    </div>

                    <!-- Vocabulary Section -->
                    <div>
                        <h3 class="text-base font-bold text-slate-200 mb-4 flex items-center space-x-2">
                            <i data-lucide="list" class="w-5 h-5 text-rose-500"></i>
                            <span>Danh sách từ vựng</span>
                        </h3>
                        <div class="grid grid-cols-1 gap-3">
                            ${vocabHtml}
                        </div>
                    </div>
                </div>
            `;

            lucide.createIcons();
        }
    }

    // Khởi tạo ứng dụng
    const app = new ChineseApp();
</script>
